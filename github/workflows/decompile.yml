name: Decompile Firewall APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Find APK
        id: apk
        run: |
          APK=$(find . -maxdepth 3 -type f -iname '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found in the repository"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Download JADX
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/skylot/jadx/releases/latest \
            | jq -r '.assets[] | select(.name | test("^jadx-[0-9].*\\.zip$")) | .browser_download_url' \
            | head -n 1)
          test -n "$URL"
          curl -fsSL "$URL" -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx

      - name: Decompile APK
        run: |
          jadx/bin/jadx \
            --show-bad-code \
            -d recovered \
            "${{ steps.apk.outputs.path }}"

      - name: Save recovered files
        uses: actions/upload-artifact@v4
        with:
          name: recovered-firewall-source
          path: recovered/
          if-no-files-found: error
          retention-days: 7
          
